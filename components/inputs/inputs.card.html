</head><body><div id="root"></div>
<script type="text/babel">
const { Calendar, Keypad } = window.GhostUIDesignSystem_a29fdf;
function Demo(){ const [d,setD]=React.useState(28); const [pin,setPin]=React.useState('42');
  return <>
    <Calendar month={7} year={2026} selected={d} onSelect={setD} disabledDays={[1,2,3]} />
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <div style={{fontFamily:'var(--font-brand)',fontSize:24,letterSpacing:6}}>{pin||'—'}</div>
      <Keypad onKey={k=>setPin(p=>k==='delete'?p.slice(0,-1):k==='clear'?'':p+k)} />
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
