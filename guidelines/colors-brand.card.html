<!DOCTYPE html><html><head><meta charset="utf-8"><title>Brand colour</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-brand)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:56px;border-radius:var(--radius-md)}
.nm{font-size:11px;line-height:1.2;color:var(--color-text-primary);font-weight:500}
.hx{font-size:10px;line-height:1.2;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:#1C70D4"></div><span class="nm">Primary</span><span class="hx">#1C70D4</span></div><div class="sw"><div class="chip" style="background:#1559AB"></div><span class="nm">Primary pressed</span><span class="hx">#1559AB</span></div><div class="sw"><div class="chip" style="background:#EC1C3C"></div><span class="nm">Required</span><span class="hx">#EC1C3C</span></div><div class="sw"><div class="chip" style="background:#F01616"></div><span class="nm">Error text</span><span class="hx">#F01616</span></div><div class="sw"><div class="chip" style="background:#B00020"></div><span class="nm">Error</span><span class="hx">#B00020</span></div><div class="sw"><div class="chip" style="background:#E22718"></div><span class="nm">Icon red</span><span class="hx">#E22718</span></div>
</div></body></html>
