<!-- @dsCard group="Colors" viewport="700x150" name="Icon greys" subtitle="#95A0B2 is the resting colour of every Jin icon" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Icon greys</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-brand)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:56px;border-radius:var(--radius-md)}
.nm{font-size:11px;line-height:1.2;color:var(--color-text-primary);font-weight:500}
.hx{font-size:10px;line-height:1.2;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:#95A0B2"></div><span class="nm">Icon default</span><span class="hx">#95A0B2</span></div><div class="sw"><div class="chip" style="background:#202020"></div><span class="nm">Icon strong</span><span class="hx">#202020</span></div><div class="sw"><div class="chip" style="background:#CDCDCD;box-shadow:inset 0 0 0 1px var(--gh-grey-150)"></div><span class="nm">Icon mute</span><span class="hx">#CDCDCD</span></div><div class="sw"><div class="chip" style="background:#D6D6D6;box-shadow:inset 0 0 0 1px var(--gh-grey-150)"></div><span class="nm">Icon light</span><span class="hx">#D6D6D6</span></div>
</div></body></html>
