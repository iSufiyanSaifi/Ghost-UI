<!DOCTYPE html><html><head><meta charset="utf-8"><title>Neutrals — greys</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-brand)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:56px;border-radius:var(--radius-md)}
.nm{font-size:11px;line-height:1.2;color:var(--color-text-primary);font-weight:500}
.hx{font-size:10px;line-height:1.2;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:#808080"></div><span class="nm">Grey 500</span><span class="hx">#808080</span></div><div class="sw"><div class="chip" style="background:#A1A1A1"></div><span class="nm">Grey 400</span><span class="hx">#A1A1A1</span></div><div class="sw"><div class="chip" style="background:#C9C9C9"></div><span class="nm">Grey 300</span><span class="hx">#C9C9C9</span></div><div class="sw"><div class="chip" style="background:#E6E6E6;box-shadow:inset 0 0 0 1px var(--gh-grey-150)"></div><span class="nm">Grey 150</span><span class="hx">#E6E6E6</span></div><div class="sw"><div class="chip" style="background:#F0F0F0;box-shadow:inset 0 0 0 1px var(--gh-grey-150)"></div><span class="nm">Grey 100</span><span class="hx">#F0F0F0</span></div><div class="sw"><div class="chip" style="background:#F8F8F8;box-shadow:inset 0 0 0 1px var(--gh-grey-150)"></div><span class="nm">Grey 50</span><span class="hx">#F8F8F8</span></div><div class="sw"><div class="chip" style="background:#FFFFFF;box-shadow:inset 0 0 0 1px var(--gh-grey-150)"></div><span class="nm">White</span><span class="hx">#FFFFFF</span></div>
</div></body></html>
