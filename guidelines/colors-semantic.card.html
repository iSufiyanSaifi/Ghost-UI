<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="What components actually reference" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Semantic aliases</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-brand);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.t{padding:12px;border-radius:var(--radius-md);display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px var(--gh-grey-150)}
.k{font-size:11px;font-weight:500}.v{font-size:10px;opacity:.7}</style></head><body>
<div class="t" style="background:var(--color-bg-default);color:var(--color-text-primary)"><span class="k">bg.default</span><span class="v">text.primary</span></div>
<div class="t" style="background:var(--color-bg-surface);color:var(--color-text-secondary)"><span class="k">bg.surface</span><span class="v">text.secondary</span></div>
<div class="t" style="background:var(--color-action-primary);color:var(--color-text-on-action)"><span class="k">action.primary</span><span class="v">text.onAction</span></div>
<div class="t" style="background:var(--color-bg-inverse);color:var(--color-text-inverse)"><span class="k">bg.inverse</span><span class="v">text.inverse</span></div>
<div class="t" data-theme="dark" style="background:var(--color-bg-default);color:var(--color-text-primary)"><span class="k">dark bg.default</span><span class="v">text.primary</span></div>
<div class="t" data-theme="dark" style="background:var(--color-bg-surface);color:var(--color-text-secondary)"><span class="k">dark bg.surface</span><span class="v">text.secondary</span></div>
<div class="t" data-theme="dark" style="background:var(--color-action-primary);color:var(--color-text-on-action)"><span class="k">dark action.primary</span><span class="v">text.onAction</span></div>
<div class="t" data-theme="dark" style="background:var(--color-bg-box);color:var(--color-text-primary)"><span class="k">dark bg.box</span><span class="v">text.primary</span></div>
</body></html>
