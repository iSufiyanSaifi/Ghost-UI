<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Never used without a word or an icon beside it" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-brand)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:56px;border-radius:var(--radius-md)}
.nm{font-size:11px;line-height:1.2;color:var(--color-text-primary);font-weight:500}
.hx{font-size:10px;line-height:1.2;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:#34A853"></div><span class="nm">Success</span><span class="hx">#34A853</span></div><div class="sw"><div class="chip" style="background:#FBA715"></div><span class="nm">Warning</span><span class="hx">#FBA715</span></div><div class="sw"><div class="chip" style="background:#FFBB00"></div><span class="nm">Caution icon</span><span class="hx">#FFBB00</span></div><div class="sw"><div class="chip" style="background:#B00020"></div><span class="nm">Error</span><span class="hx">#B00020</span></div><div class="sw"><div class="chip" style="background:#0066B1"></div><span class="nm">Info</span><span class="hx">#0066B1</span></div><div class="sw"><div class="chip" style="background:#0000FF"></div><span class="nm">Link</span><span class="hx">#0000FF</span></div>
</div></body></html>
