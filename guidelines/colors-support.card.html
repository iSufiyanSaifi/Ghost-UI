<!DOCTYPE html><html><head><meta charset="utf-8"><title>Supporting hues</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-brand)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:56px;border-radius:var(--radius-md)}
.nm{font-size:11px;line-height:1.2;color:var(--color-text-primary);font-weight:500}
.hx{font-size:10px;line-height:1.2;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:#182E6F"></div><span class="nm">Navy</span><span class="hx">#182E6F</span></div><div class="sw"><div class="chip" style="background:#A7DEFF"></div><span class="nm">Sky</span><span class="hx">#A7DEFF</span></div><div class="sw"><div class="chip" style="background:#CECFFF"></div><span class="nm">Periwinkle</span><span class="hx">#CECFFF</span></div><div class="sw"><div class="chip" style="background:#FF6E32"></div><span class="nm">Orange accent</span><span class="hx">#FF6E32</span></div><div class="sw"><div class="chip" style="background:#0066B1"></div><span class="nm">Icon blue</span><span class="hx">#0066B1</span></div><div class="sw"><div class="chip" style="background:#003D78"></div><span class="nm">Dark blue</span><span class="hx">#003D78</span></div>
</div></body></html>
