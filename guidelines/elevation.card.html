<!DOCTYPE html><html><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-brand);display:flex;gap:16px;align-items:center;background:var(--gh-white)}
.c{width:150px;height:88px;border-radius:var(--radius-lg);background:#fff;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font-size:10px;color:var(--color-text-secondary)}</style></head><body>
<div class="c" style="border:0.6px solid var(--gh-grey-150)">0.6px hairline</div>
<div class="c" style="box-shadow:inset 0 0 0 0.5px var(--gh-grey-150)">0.5px inset ring</div>
<div class="c" style="box-shadow:var(--shadow-inset-control)">inset control</div>
<div class="c" style="box-shadow:var(--shadow-raised)">raised 0 2 6</div>
<div class="c" style="box-shadow:58px 26px 68px 0 rgba(35,44,93,.06)">soft card glow</div>
</body></html>
