<!DOCTYPE html><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-brand);display:flex;gap:12px;align-items:flex-end}
.r{display:flex;flex-direction:column;gap:6px;align-items:center}
.b{width:76px;height:64px;background:var(--gh-grey-50);box-shadow:inset 0 0 0 1px var(--gh-grey-150)}
.l{font-size:10px;color:var(--color-text-secondary)}</style></head><body>
<div class="r"><div class="b" style="border-radius:4px"></div><span class="l">xs · 4</span></div><div class="r"><div class="b" style="border-radius:6px"></div><span class="l">sm · 6</span></div><div class="r"><div class="b" style="border-radius:8px"></div><span class="l">md · 8</span></div><div class="r"><div class="b" style="border-radius:12px"></div><span class="l">lg · 12</span></div><div class="r"><div class="b" style="border-radius:16px"></div><span class="l">xl · 16</span></div><div class="r"><div class="b" style="border-radius:20px"></div><span class="l">2xl · 20</span></div><div class="r"><div class="b" style="border-radius:36px"></div><span class="l">device · 36</span></div><div class="r"><div class="b" style="border-radius:999px"></div><span class="l">pill · 999</span></div>
</body></html>
