<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing in use</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-brand);background:var(--color-bg-surface)}
.row{display:flex;align-items:center;gap:12px;height:56px;padding:8px 16px;border-radius:var(--radius-pill);background:#fff;box-shadow:inset 0 0 0 1px var(--gh-grey-150)}
.av{width:40px;height:40px;border-radius:50%;background:var(--gh-grey-120)}
.t{display:flex;flex-direction:column;flex:1}.t b{font-size:14px;font-weight:400}.t span{font-size:12px;color:var(--color-text-secondary)}
.ring{width:36px;height:36px;border-radius:50%;border:3px solid var(--gh-grey-150);border-top-color:var(--color-action-primary)}
.note{margin-top:12px;font-size:11px;color:var(--color-text-secondary)}</style></head><body>
<div class="row"><div class="av"></div><div class="t"><b>Drink the water</b><span>500/2000 ML</span></div><div class="ring"></div></div>
<p class="note">gap 12 · padding 8 16 · height 56 · radius 999</p>
</body></html>
