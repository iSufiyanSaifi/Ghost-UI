<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ghost-UI — App kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--gh-grey-50);display:flex;gap:24px;align-items:flex-start;justify-content:center}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="HabitsScreen.jsx"></script>
<script type="text/babel" src="EventsScreen.jsx"></script>
<script type="text/babel" src="CommunityScreen.jsx"></script>
<script type="text/babel" src="ProfileScreen.jsx"></script>
<script type="text/babel">
const { Dialog } = window.GhostUIDesignSystem_a29fdf;
function App(){
  const [signedIn,setSignedIn]=React.useState(false);
  const [tab,setTab]=React.useState('home');
  const [dialog,setDialog]=React.useState(false);
  if(!signedIn) return <Screen nav={false}><LoginScreen onSignIn={()=>setSignedIn(true)} /></Screen>;
  const body = tab==='events' ? <EventsScreen onOpen={()=>setDialog(true)} />
    : tab==='community' ? <CommunityScreen />
    : tab==='profile' ? <ProfileScreen onSignOut={()=>setSignedIn(false)} />
    : <HabitsScreen onAdd={()=>setDialog(true)} />;
  return <>
    <Screen tab={tab} onTab={t=>setTab(t==='add'?'home':t)}>{body}</Screen>
    {dialog && <div style={{position:'fixed',inset:0,background:'var(--color-scrim)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
      <Dialog title="Confirmation" confirmLabel="Approve" cancelLabel="Cancel"
        onConfirm={()=>setDialog(false)} onCancel={()=>setDialog(false)}>
        You've submitted your details. If everything looks correct, click 'Approve' to proceed or cancel to make changes
      </Dialog></div>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
